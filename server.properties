# bedmcp's own settings for the test servers (one per Claude session). Applied on top of each
# server's server.properties at every start, after the game keys copied from the project (its
# server.properties, if it has one, and "serverProperties" in bedmcp.json). The project's files are
# never edited. A key here always wins, except the ports: bedmcp gives each slot its own
# (server-port 19140, 19142, 19144 ...).

# Offline: Be.D.D. clients join without Xbox Live authentication.
online-mode=false

# Networking that makes a Be.D.D. client able to join (verified 2026-11-17).
server-ip=127.0.0.1
transport=nethernet
enable-lan-visibility=false

allow-list=false
player-idle-timeout=0

# Print the packs' console.log/warn/error ([Scripting] lines) to the log bedmcp reads.
content-log-console-output-enabled=true

# The script debugger (bedmcp's debug tool): bedmcp listens on loopback and the server connects to it
# ("script debugger connect 127.0.0.1 <port>"). Inbound "listen" accepts a socket on this BDS but
# never answers it (seen 2026-11-24), so it stays off.
allow-outbound-script-debugging=true
allow-inbound-script-debugging=false
